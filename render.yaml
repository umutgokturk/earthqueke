# MESNET MÜHENDİSLİK — İstanbul deprem paneli · Render.com Blueprint
# (Render servis adları/adresleri kurulum kimliğidir, marka değişse de aynı kalır)
#
# Kurulum: render.com → New → Blueprint → bu repo'yu seç → Apply. Hepsi bu;
# elle ortam değişkeni girmek gerekmez (admin şifresi otomatik üretilir,
# servis adresleri aşağıda hazır yazılıdır).
#
# Not: Servis adları başka biri tarafından alınmışsa Render adrese ek uzantı
# koyar; o durumda aşağıdaki üç adresi dashboard'daki gerçek adreslerle değiştir.
#
# Free planda servisler 15 dk hareketsizlikte uyur; ilk ziyarette ~1 dk içinde
# uyanır. Veritabanı yoktur (bellek modu): uyanınca AFAD'dan son 6 saat otomatik
# geri yüklenir ve canlı akış kaldığı yerden devam eder.

services:
  # ── REST + WebSocket API (gömülü veri toplama ile) ─────────
  - type: web
    name: tarih-mimarlik-api
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev --no-audit --no-fund && npm run build -w @ils/api
    startCommand: node apps/api/dist/main.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: '20'
      - key: NODE_ENV
        value: production
      - key: EMBEDDED_INGESTION
        value: 'true'
      - key: LOG_LEVEL
        value: info
      - key: ADMIN_USERNAME
        value: admin
      # Admin şifresi — Render otomatik üretir; değeri dashboard'da bu servisin
      # Environment sekmesinden okuyabilir veya değiştirebilirsin
      - key: ADMIN_PASSWORD
        generateValue: true
      # Oturum imza anahtarı — Render otomatik üretir
      - key: ADMIN_JWT_SECRET
        generateValue: true
      # Web servisinin PUBLIC adresi — WebSocket origin kontrolü ve CORS için
      - key: WEB_ORIGIN
        value: https://tarih-mimarlik-web.onrender.com

  # ── Next.js arayüz ─────────────────────────────────────────
  - type: web
    name: tarih-mimarlik-web
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev --no-audit --no-fund && npm run build -w @ils/web
    startCommand: npm run start -w @ils/web
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: '20'
      - key: NODE_ENV
        value: production
      # API servisinin PUBLIC adresi (sunucu tarafı /api proxy hedefi)
      - key: API_PROXY_TARGET
        value: https://tarih-mimarlik-api.onrender.com
      # Tarayıcının WebSocket adresi — yanlış/erişilemez olursa uygulama
      # 30 sn'lik polling moduna düşer, yine çalışır
      - key: NEXT_PUBLIC_WS_URL
        value: wss://tarih-mimarlik-api.onrender.com/ws
